    <!-- Anti-flash: aplica el tema guardado ANTES de que cargue cualquier CSS -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) { }
        })();
    </script>
    <!-- Bootstrap 5.3.3 (dark mode nativo via data-bs-theme) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="apple-touch-icon" sizes="192x192" href="icon.svg" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- Loader: un programa de PLC que enciende un semáforo. Las lámparas y la
             línea resaltada siguen el avance real de la descarga (ver app.css,
             sección "LOADER DE INICIO"). -->
        <div class="loader-container" role="status" aria-label="Cargando">
            <div class="loader-scene" aria-hidden="true">
                <div class="loader-code">
                    <div class="loader-code-bar"><i></i><i></i><i></i>Arranque.st</div>
                    <div class="loader-code-body">
                        <div class="ld-line"><b>IF</b> carga &lt; 40 <b>THEN</b></div>
                        <div class="ld-line" data-step="red">    rojo  := <u>TRUE</u>;</div>
                        <div class="ld-line"><b>ELSIF</b> carga &lt; 85 <b>THEN</b></div>
                        <div class="ld-line" data-step="amber">    ambar := <u>TRUE</u>;</div>
                        <div class="ld-line"><b>ELSE</b></div>
                        <div class="ld-line" data-step="green">    verde := <u>TRUE</u>;</div>
                        <div class="ld-line"><b>END_IF</b>;</div>
                    </div>
                </div>
                <div class="loader-wire"></div>
                <div class="loader-semaforo">
                    <span class="lamp lamp-red"></span>
                    <span class="lamp lamp-amber"></span>
                    <span class="lamp lamp-green"></span>
                </div>
            </div>
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
            <div class="loader-text">Cargando</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Antes de Blazor: así ya observa el DOM cuando se renderiza la primera página -->
    <script src="js/animations.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Limpia service workers para evitar problemas de caché
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
</body>

</html>
